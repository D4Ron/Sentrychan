# Adds a "Sponsor" button to the top of the GitHub repository page.
#
# Uncomment ONE (or more) of the lines below and put your own username/handle in.
# Delete the rest. GitHub validates this file, so a placeholder left uncommented
# will show a broken button — keep unused lines commented out.
#
# GitHub Sponsors is the usual choice for an open-source project: GitHub takes no
# cut, it supports one-off and monthly, and the button appears right on the repo.
# It needs enabling once at https://github.com/sponsors before the handle works.

# github: D4Ron
# ko_fi: yourhandle
# buy_me_a_coffee: yourhandle
# patreon: yourhandle
# liberapay: yourhandle
# open_collective: yourproject
# custom: ["https://example.com/donate"]
