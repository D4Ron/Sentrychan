# Preview builds for macOS and Linux.
#
# Builds and tests on Linux, then packs unsigned macOS (arm64, x64) and Linux (x64 AppImage)
# previews with Velopack and keeps them as workflow artifacts. It never creates or edits a
# GitHub Release: publishing stays a manual step. The public, source-less build is packed
# (-p:IncludeSources=false), so the packages connect to nothing on their own.
#
# The Mac build isn't signed with an Apple Developer ID (that needs a paid membership) — it
# gets an ad-hoc signature, which Apple Silicon requires for anything to run at all, and
# macOS will ask the user to allow it on first launch (System Settings → Privacy & Security →
# Open Anyway).

name: Preview desktop builds

on:
  push:
    branches: [preview]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PACK_ID: SentrychanPreview
  PACK_TITLE: Sentrychan Preview

jobs:
  test:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build, stable flavour
        run: dotnet build Sentrychan.sln -c Release -p:IncludeSources=false

      - name: Build, preview flavour
        run: dotnet build Sentrychan.sln -c Release -p:Flavor=Preview -p:IncludeSources=false

      - name: Test
        run: dotnet test Sentrychan.Tests -c Release -p:Flavor=Preview -p:IncludeSources=false --no-build --logger "console;verbosity=normal"

  pack:
    name: Pack ${{ matrix.rid }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-22.04 # the oldest glibc still offered, so the AppImage runs on more systems
            channel: preview-linux
          - rid: osx-arm64
            os: macos-15
            channel: preview-osx
          - rid: osx-x64
            os: macos-15-intel
            channel: preview-osx
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The app targets .NET 9; the Velopack CLI (vpk) runs on .NET 10.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Install vpk
        # Same version as the Velopack library the app references.
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Version
        shell: bash
        run: |
          base=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Sentrychan.App/Sentrychan.App.csproj | head -1)
          echo "VERSION=${base}-preview.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Publish
        run: >
          dotnet publish Sentrychan.App/Sentrychan.App.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true -p:Flavor=Preview -p:IncludeSources=false -o publish

      - name: AppImage tools
        if: startsWith(matrix.rid, 'linux')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends squashfs-tools

      - name: Pack (Linux AppImage)
        if: startsWith(matrix.rid, 'linux')
        run: >
          vpk pack --packId "$PACK_ID" --packVersion "$VERSION" --packDir publish
          --mainExe Sentrychan.App --packTitle "$PACK_TITLE" --packAuthors D4Ron
          --icon Sentrychan.UI/Assets/logo.png --categories AudioVideo
          --channel ${{ matrix.channel }} --runtime ${{ matrix.rid }} --outputDir releases

      - name: Icon (macOS)
        if: startsWith(matrix.rid, 'osx')
        run: |
          mkdir Sentrychan.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s Sentrychan.UI/Assets/logo.png --out Sentrychan.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s * 2)); [ $d -le 512 ] || d=512
            sips -z $d $d Sentrychan.UI/Assets/logo.png --out Sentrychan.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns Sentrychan.iconset -o Sentrychan.icns

      - name: Bundle and ad-hoc sign (macOS)
        if: startsWith(matrix.rid, 'osx')
        run: |
          vpk bundle --packId "$PACK_ID" --packVersion "$VERSION" --packDir publish \
            --mainExe Sentrychan.App --packTitle "$PACK_TITLE" --packAuthors D4Ron \
            --icon Sentrychan.icns --channel ${{ matrix.channel }} --runtime ${{ matrix.rid }} --outputDir bundle
          app=$(find bundle -maxdepth 1 -name '*.app' | head -1)
          # No Developer ID: an ad-hoc signature, without which Apple Silicon won't run the binaries.
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --verbose=2 "$app"
          echo "APP_BUNDLE=$app" >> "$GITHUB_ENV"

      - name: Pack (macOS)
        if: startsWith(matrix.rid, 'osx')
        run: >
          vpk pack --packId "$PACK_ID" --packVersion "$VERSION" --packDir "$APP_BUNDLE"
          --mainExe Sentrychan.App --packTitle "$PACK_TITLE" --packAuthors D4Ron
          --icon Sentrychan.icns --channel ${{ matrix.channel }} --runtime ${{ matrix.rid }} --outputDir releases

      - uses: actions/upload-artifact@v4
        with:
          name: sentrychan-preview-${{ matrix.rid }}-${{ env.VERSION }}
          path: releases/
          retention-days: 30
          if-no-files-found: error
